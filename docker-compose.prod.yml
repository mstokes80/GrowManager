# ============================================================
# Production Docker Compose for GrowManager
# ============================================================
# Services: frontend (Nginx), backend, PostgreSQL, Redis, MinIO
# Usage: docker-compose -f docker-compose.prod.yml up -d
# ============================================================

version: '3.8'

services:
  # -------------------------
  # Frontend (Nginx + React)
  # -------------------------
  frontend:
    build:
      context: ./growmanager-ui
      dockerfile: Dockerfile
    container_name: growmanager-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - growmanager-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.growmanager.service=frontend"
      - "com.growmanager.version=1.0.0"

  # -------------------------
  # Backend (Spring Boot API)
  # -------------------------
  backend:
    build:
      context: ./growmanager-api
      dockerfile: Dockerfile
    container_name: growmanager-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-growmanager}
      DB_USERNAME: ${DB_USERNAME:-growmanager}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # MinIO/S3 Configuration
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost/storage}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_PHOTOS: ${MINIO_BUCKET_PHOTOS:-growmanager-photos}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      # Email Configuration
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-noreply@growmanager.com}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@growmanager.com}

      # Frontend URL
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

      # JVM Options
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - growmanager-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - "com.growmanager.service=backend"
      - "com.growmanager.version=1.0.0"

  # -------------------------
  # PostgreSQL Database
  # -------------------------
  postgres:
    image: postgres:14-alpine
    container_name: growmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-growmanager}
      POSTGRES_USER: ${DB_USERNAME:-growmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount init scripts for first-time setup
      # - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - growmanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-growmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.growmanager.service=database"

  # -------------------------
  # Redis Cache
  # -------------------------
  redis:
    image: redis:7-alpine
    container_name: growmanager-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - growmanager-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.growmanager.service=cache"

  # -------------------------
  # MinIO Object Storage
  # -------------------------
  minio:
    image: minio/minio:latest
    container_name: growmanager-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - growmanager-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    labels:
      - "com.growmanager.service=storage"

  # -------------------------
  # MinIO Initialization
  # -------------------------
  minio-init:
    image: minio/mc:latest
    container_name: growmanager-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      BUCKET_NAME: ${MINIO_BUCKET_PHOTOS:-growmanager-photos}
    volumes:
      - ./docker-scripts:/scripts
    entrypoint: /scripts/minio-init.sh
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - growmanager-network
    restart: "no"

# -------------------------
# Volumes (Persistent Data)
# -------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# -------------------------
# Networks
# -------------------------
networks:
  growmanager-network:
    driver: bridge