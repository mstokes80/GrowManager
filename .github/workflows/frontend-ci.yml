name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'growmanager-ui/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'growmanager-ui/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: growmanager-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./growmanager-ui
        run: npm ci

      - name: Run ESLint
        working-directory: ./growmanager-ui
        run: npm run lint

      - name: Check Prettier formatting
        working-directory: ./growmanager-ui
        run: npm run format:check

      - name: TypeScript type checking
        working-directory: ./growmanager-ui
        run: npm run type-check

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: growmanager-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./growmanager-ui
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./growmanager-ui
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: growmanager-ui/coverage/

      - name: Generate coverage summary
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          working-directory: growmanager-ui

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: growmanager-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./growmanager-ui
        run: npm ci

      - name: Build application
        working-directory: ./growmanager-ui
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: growmanager-ui-dist
          path: growmanager-ui/dist/
          retention-days: 7

      - name: Check bundle size
        working-directory: ./growmanager-ui
        run: |
          BUNDLE_SIZE=$(du -sh dist | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          echo "BUNDLE_SIZE=$BUNDLE_SIZE" >> $GITHUB_ENV

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Build Size Report\n\n📦 Bundle size: **${{ env.BUNDLE_SIZE }}**`
            })