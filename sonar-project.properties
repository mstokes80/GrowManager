# SonarCloud Configuration for GrowManager
# This file configures quality gates and analysis parameters

# Organization and project keys (replace with your actual values)
sonar.organization=mstokes80
sonar.projectKey=growmanager

# Project metadata
sonar.projectName=GrowManager
sonar.projectVersion=0.0.1

# Source and test directories
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.config.ts,**/*.config.js

# Quality Gate Settings
sonar.qualitygate.wait=true

# Code coverage thresholds
sonar.coverage.minimum=70.0

# Duplication thresholds
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx

# Language-specific settings
sonar.java.source=17
sonar.java.binaries=growmanager-api/target/classes
sonar.java.test.binaries=growmanager-api/target/test-classes
sonar.java.libraries=growmanager-api/target/dependency/*.jar

# JavaScript/TypeScript settings
sonar.javascript.node.maxspace=4096
sonar.typescript.tsconfigPath=growmanager-ui/tsconfig.json

# Additional settings
sonar.scm.provider=git